<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Privacy policy for Kafka Kube, the Android railway puzzle game by ChilliCactus Games.">
<title>Kafka Kube — Privacy Policy</title>
<style>
:root{color-scheme:light;--green:#000;--ink:#000;--muted:#000;--line:#d8cfb9;--cream:#fff3d6}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.75 Georgia,"Times New Roman",serif}
main{max-width:800px;margin:48px auto;padding:44px 48px;background:var(--cream)}
.brand{margin:0;color:var(--ink);font-size:23px;font-weight:700;line-height:1.3;letter-spacing:2px;text-transform:uppercase}
h1{margin:18px 0 8px;color:var(--ink);font-size:clamp(32px,6vw,42px);font-weight:400;line-height:1.2}
.meta{margin:0;color:var(--muted);font-size:14px}
header{padding-bottom:28px;border-bottom:1px solid var(--line)}
h2{margin:34px 0 12px;color:var(--green);font-size:17px;line-height:1.45;letter-spacing:.3px}
p{margin:0 0 18px}ul{padding-left:24px;margin:0 0 20px}li{margin:8px 0;padding-left:3px}
a{color:var(--green);text-underline-offset:3px;overflow-wrap:anywhere}
a:hover{color:#000;text-decoration-thickness:2px}a:focus-visible{outline:3px solid #000;outline-offset:4px;border-radius:2px}
footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
@media(max-width:600px){body{font-size:16px}main{margin:0;padding:28px 22px;border-left:0;border-right:0;border-radius:0}h2{margin-top:28px}}
@media print{body{background:white;color:black;font-size:11pt}main{max-width:none;margin:0;padding:0;border:0}h2{break-after:avoid}p,li{orphans:3;widows:3}footer{display:none}}
</style>
</head>
<body>
<main>
<header><p class="brand">Kafka Kube</p><h1>Privacy policy</h1><p class="meta">ChilliCactus Games</p><p class="meta" id="updated">Last updated: 29 October 2026</p></header>
<article id="policy" aria-label="Privacy policy"></article>
<footer><a href="privacy-policy.txt">Read the plain text version</a></footer>
</main>
<script>
// The embedded policy works when this file is opened directly. When hosted,
// refresh it from the adjacent TXT so that the TXT remains the source of truth.
if (location.protocol === 'https:' || location.protocol === 'http:') {
  fetch('privacy-policy.txt', {cache:'no-store'})
    .then(response => {if (!response.ok) throw new Error('Policy unavailable'); return response.text();})
    .then(text => {
      const blocks = text.trim().split(/\r?\n\s*\r?\n/), content = document.createDocumentFragment();
      for (const block of blocks.slice(1)) {
        const list = block.startsWith('- '), element = document.createElement(/^\d+\.\s/.test(block) ? 'h2' : list ? 'ul' : 'p');
        const parts = list ? block.split(/^-[ \t]+/m).filter(Boolean) : [block];
        for (const part of parts) {
          const target = list ? document.createElement('li') : element;
          const value = part.replace(/\s*\r?\n\s*/g, ' ').trim();
          for (const token of value.split(/(https:\/\/[^\s]+|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,})/g)) {
            if (/^https:\/\//.test(token) || /^[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}$/.test(token)) {
              const link = document.createElement('a'); link.textContent = token; link.href = token.includes('@') ? 'mailto:' + token : token; target.append(link);
            } else target.append(document.createTextNode(token));
          }
          if (list) element.append(target);
        }
        content.append(element);
      }
      document.getElementById('policy').replaceChildren(content);
      const updated = blocks[0].split(/\r?\n/).find(line => line.startsWith('Last updated:'));
      if (updated) document.getElementById('updated').textContent = updated;
    })
    .catch(() => {}); // Keep the embedded policy if the TXT cannot be loaded.
}
</script>
</body>
</html>
